name: Swap Dave's Saber Color

on:
  schedule:
    # Every Wednesday at 14:00 UTC (9am ET)
    - cron: '0 14 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - id: check_window
        name: Check 6-month window
        run: |
          END=$(date -u -d "2026-11-13" +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -ge "$END" ]; then
            echo "Past 6-month window — workflow will be a no-op."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check_window.outputs.active == 'true'
        uses: actions/checkout@v4

      - if: steps.check_window.outputs.active == 'true'
        name: Swap Dave's color
        run: python3 .github/scripts/swap_dave_color.py

      - if: steps.check_window.outputs.active == 'true'
        name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add index.html
            git commit -m "Auto-swap Dave's saber color (scheduled)"
            git push
          else
            echo "No changes to commit."
          fi
